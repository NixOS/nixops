version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    schedule:
      interval: "monthly"
    groups:
      docs:
        patterns:
          - "*"
